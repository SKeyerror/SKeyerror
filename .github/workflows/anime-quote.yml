name: 🎴 Anime Quote of the Day

on:
  schedule:
    - cron: "30 0 * * *"       # 08:30 Asia/Shanghai
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Fetch a fresh quote from AnimeChan
        run: python3 scripts/anime_quote.py

      - name: Commit the new quote
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore(quote): 今日の一言"
          file_pattern: README.md
