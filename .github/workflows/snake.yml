name: 🐍 Python Snake

on:
  schedule:
    - cron: "0 0 * * *"        # 08:00 Asia/Shanghai
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/snake.yml"
      - "scripts/pythonize_snake.py"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Generate the snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?palette=github-light
            dist/github-snake-dark.svg?palette=github-dark&color_dots=#1a1b26,#394b70,#3d59a1,#7aa2f7,#bb9af7

      - name: Python colours, white eye, no progress bar
        run: python3 scripts/pythonize_snake.py --no-bar dist/github-snake.svg dist/github-snake-dark.svg

      - name: Push the SVGs to the `output` branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
