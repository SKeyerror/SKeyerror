name: 📊 Profile Summary Cards

on:
  schedule:
    - cron: "15 0 * * *"       # 08:15 Asia/Shanghai, between snake and quote
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Generate the tokyonight cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          # Falls back to the default token; add a PAT as SUMMARY_GITHUB_TOKEN
          # to include private-repo activity in the numbers.
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: main
          UTC_OFFSET: 8
          THEME: tokyonight
          ANIMATION: rise
          AUTO_PUSH: true
