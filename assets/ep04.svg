<svg xmlns="http://www.w3.org/2000/svg" width="880" height="72" viewBox="0 0 880 72" role="img" aria-label="Episode 04: NOW HACKING ON">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f2335"/>
      <stop offset="1" stop-color="#1a1b26"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9ece6a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#9ece6a" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#9ece6a" fill-opacity="0.10"/>
    </pattern>
    <clipPath id="clip"><rect width="880" height="72" rx="12"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="880" height="72" fill="url(#bg)"/>
    <rect x="480" width="400" height="72" fill="url(#dots)"/>
    <!-- episode block -->
    <rect width="104" height="72" fill="#9ece6a" fill-opacity="0.12"/>
    <rect width="5" height="72" fill="#9ece6a"/>
    <text x="22" y="28" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,monospace" font-size="11" letter-spacing="3" fill="#9ece6a" fill-opacity="0.85">EPISODE</text>
    <text x="21" y="58" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,monospace" font-size="30" font-weight="700" fill="#9ece6a">04</text>
    <!-- titles -->
    <text x="126" y="36" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="25" font-weight="700" fill="#c0caf5">進行中</text>
    <text x="127" y="58" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,monospace" font-size="12" letter-spacing="3.5" fill="#9ece6a">NOW HACKING ON</text>
    <text x="852" y="45" text-anchor="end" font-family="'Noto Sans JP','Noto Sans CJK JP','Hiragino Sans','Yu Gothic UI','Microsoft YaHei','PingFang SC','Noto Sans SC',sans-serif" font-size="17" fill="#565f89">正在折腾</text>
    <!-- accent hairline along the bottom -->
    <rect x="104" y="71" width="776" height="1" fill="url(#fade)"/>
  </g>
  <rect x="0.5" y="0.5" width="879" height="71" rx="12" fill="none" stroke="#292e42"/>
</svg>
